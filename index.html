<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Praktikum Git & Web</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Header & Navigasi Semantik -->
    <header>
      <nav><a href="#">Beranda</a> | <a href="#">Tentang</a></nav>
    </header>

    <!-- Heading sesuai poin 3 -->
    <h1 id="judulUtama">Halaman Awal</h1>

    <!-- Kartu Profil -->
    <div class="kartu-profil">
      <p>Profil Siswa</p>

    <!-- Footer Semantik -->
    <footer>
      <p>&copy; 2026 Tim Praktikum</p>

    <!-- Script JS DOM sesuai poin 4 -->
    <script>
      const judul = document.getElementById("judulUtama");
      if (judul) {
        judul.textContent = "Selamat Datang Siswa";
      }
    </script>
